[package]
name = "kasumi-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kasumi Proxy — Tauri 2 desktop (and future mobile) app over the neutral Rust backend."
rust-version = "1.95.0"
# This crate has a second bin (`codegen`). Without default-run, `cargo tauri build`
# picks the alphabetically-first binary (`codegen` < `kasumi-desktop`) as the app
# and bundles THAT — shipping a binary that just runs codegen and crashes on launch
# (tauri-apps/tauri#4807, #13420). Pin the app binary explicitly.
default-run = "kasumi-desktop"

[lib]
# The Tauri mobile/desktop entry point lives in the lib; the bin is a thin shim.
name = "kasumi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# The privileged helper is a separate process, so it can't use tauri-plugin-log
# (that needs an AppHandle). It installs its own `fern` sink — the same backend the
# plugin wraps — so both processes log through one `log` facade. See privhelper::hlog.
fern = "0.7"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "fs",
  "net",
  "io-util",
  "time",
  "sync",
] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
specta = { version = "2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
specta-serde = "0.0.12"
specta-zod = "0.0.3"
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
strum = { version = "0.26", features = ["derive"] }

kasumi-core = { path = "../crates/kasumi-core" }
kasumi-backend = { path = "../crates/kasumi-backend" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"

# Linux pkexec elevation reads geteuid (desktop/elevate.rs). `caps` drives the
# least-privilege data-path: the helper drops its bounding set to the caps it
# actually needs and grants the test cores an ambient CAP_NET_RAW so their
# uplink bind survives exec (see desktop/privhelper/entry.rs, platform.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
caps = "0.5"

# logind `PrepareForSleep` subscription over the system bus (desktop/linux/resume.rs).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = "0.3"

# Windows privilege separation: the LocalSystem data-path service (windows-service)
# + the named-pipe security descriptor and the one-time install elevation
# (ShellExecuteW runas) — see desktop/privhelper/{service,connect}.rs, elevate.rs.
# Win32_System_Power: resume notification callback (desktop/windows/resume.rs).
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Power",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
