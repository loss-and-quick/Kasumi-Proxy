[package]
name = "kasumi-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless daemon binary for the KSU/Magisk/APatch module: serves webroot + token-gated WS over the neutral backend. Implements Platform for Android."

# The Android module invokes `kasumi-proxy daemon` / `kasumi-proxy wsInfo`, so the
# binary keeps that name regardless of the crate name.
[[bin]]
name = "kasumi-proxy"
path = "src/main.rs"

[dependencies]
kasumi-core = { path = "../kasumi-core" }
kasumi-backend = { path = "../kasumi-backend" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "time",
    "fs",
    "process",
    "io-util",
] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
