[package]
name = "kasumi-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Neutral domain core (profiles, share links, config builders, sub-apply) — Rust port of packages/core."

[dependencies]
specta = { version = "2.0.0-rc.25", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
regex = "1"
fancy-regex = "0.14"
percent-encoding = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
strum = { version = "0.26", features = ["derive"] }
yaml_serde = "0.10.4"

[dev-dependencies]
tempfile = "3"
