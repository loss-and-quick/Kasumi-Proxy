[package]
name = "kasumi-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Transport-neutral orchestration (Platform trait, RPC commands, lifecycle, daemon, HTTP/WS server) — Rust port of packages/backend."

[dependencies]
specta = { version = "2.0.0-rc.25", features = ["derive"] }
kasumi-core = { path = "../kasumi-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "fs",
    "net",
    "io-util",
    "time",
    "sync",
    "signal",
] }
async-trait = "0.1"
anyhow = "1"
log = "0.4"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "socks",
    "gzip",
    "brotli",
    "deflate",
] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
