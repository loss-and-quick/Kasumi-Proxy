[package]
name = "kasumi-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Transport-neutral orchestration (Platform trait, RPC commands, lifecycle, daemon, HTTP/WS server) — Rust port of packages/backend."

[dependencies]
specta = { version = "2.0.0-rc.25", features = ["derive"] }
kasumi-core = { path = "../kasumi-core" }
happ-sub = { workspace = true, features = ["device"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "fs",
    "net",
    "io-util",
    "time",
    "sync",
    "signal",
] }
async-trait = "0.1"
anyhow = "1"
log = "0.4"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
hmac = "0.12"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "socks",
    "http2",
    "gzip",
    "brotli",
    "deflate",
    "cookies",
] }
cookie_store = { version = "0.22", default-features = false }

# Process identity is OS-specific: POSIX reads /proc + kill(2) (libc); Windows
# queries the process image path + TerminateProcess (windows-sys). Children die
# with their parent through PR_SET_PDEATHSIG on Linux and a kill-on-close job
# object on Windows. See proc.rs.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
# Builds `happ://crypt` links to local test servers.
rsa = "0.9"
base64 = "0.22"
# A local TLS server that agrees HTTP/2 or HTTP/1.1 over ALPN.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
h2 = "0.4"
http = "1"
bytes = "1"
