name: Nightly Debug Build

on:
  schedule:
    - cron: "0 2 * * *"  # every day at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Check whether a nightly build is warranted
        id: check
        run: |
          # Paths whose changes actually affect the shipped artifact (docs/ci/chore
          # commits must not trigger a nightly). Kept in sync with release.yml.
          paths=(
            'module/*.sh'
            'module/bin/kasumi-proxyctl'
            'module/bin/utils.sh'
            'module/webroot/cgi-bin/'
            'control-center/src/'
            'scripts/fetch-bin.sh'
            'scripts/package-release.sh'
          )

          # Code commits in the last 24h — keeps the nightly tied to recent work.
          recent=$(git log --oneline --since="24 hours ago" -- "${paths[@]}" 2>/dev/null | wc -l)

          # Code commits since the last release tag. Without this a build still
          # fires when commits landed during the day *and* a release was cut after
          # them: those commits are within 24h, but the release already shipped
          # everything, so last_tag..HEAD has nothing new to build.
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$last_tag" ]; then
            since_release=$recent
          else
            since_release=$(git log "$last_tag"..HEAD --oneline -- "${paths[@]}" 2>/dev/null | wc -l)
          fi

          echo "recent=$recent" >> "$GITHUB_OUTPUT"
          echo "since_release=$since_release" >> "$GITHUB_OUTPUT"
          if [ "$recent" -gt 0 ] && [ "$since_release" -gt 0 ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        if: steps.check.outputs.skip != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('control-center/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Setup Go
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          cache: false

      - name: Cache Go build & modules
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-geodat2srs
          restore-keys: go-${{ runner.os }}-

      - name: Setup NDK
        if: steps.check.outputs.skip != 'true'
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r28

      - name: Clone geodat2srs
        if: steps.check.outputs.skip != 'true'
        run: git clone https://github.com/loss-and-quick/geodat2srs.git $HOME/geodat2srs

      - name: Install UI dependencies
        if: steps.check.outputs.skip != 'true'
        working-directory: control-center
        run: bun install --frozen-lockfile

      - name: Lint & test
        if: steps.check.outputs.skip != 'true'
        working-directory: control-center
        run: |
          bun run check
          bun run check:i18n
          bun run test

      - name: Build debug zip
        if: steps.check.outputs.skip != 'true'
        env:
          NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          version=$(grep -m1 '^version=' module/module.prop | cut -d= -f2)
          sha=$(git rev-parse --short HEAD)
          BUILD_NAME="kasumi-proxy-${version}-debug-${sha}" scripts/package-release.sh

      - name: Upload artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kasumi-proxy-debug-${{ github.sha }}
          path: build/*.zip
          retention-days: 7
