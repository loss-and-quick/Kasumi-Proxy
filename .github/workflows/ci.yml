name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: control-center
        run: bun install --frozen-lockfile

      - name: Biome check (format + lint)
        working-directory: control-center
        run: bun run check

      - name: TypeScript
        working-directory: control-center
        run: bun run build --noEmit 2>/dev/null || bun x tsc --noEmit

      - name: Tests
        working-directory: control-center
        run: bun run test

      - name: ShellCheck
        run: |
          # Module payload runs under Android mksh — lint as POSIX sh.
          shellcheck -s sh \
            module/service.sh \
            module/customize.sh \
            module/action.sh \
            module/uninstall.sh \
            module/bin/kasumi-proxyctl \
            module/webroot/cgi-bin/exec
          # Build/release helpers are #!/usr/bin/env bash — lint as bash, not sh.
          shellcheck -s bash scripts/*.sh
