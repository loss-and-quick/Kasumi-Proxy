name: 💡 Feature request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and this is not already requested
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web UI / desktop UI (frontend)
        - Data path / routing (Android module or Linux desktop)
        - Desktop app (Tauri — tray, autostart, packaging)
        - Protocols / config generation
        - Build / release / CI
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what's missing or painful today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or how other clients handle this.
