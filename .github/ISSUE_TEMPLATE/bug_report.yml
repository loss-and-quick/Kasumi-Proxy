name: 🐞 Bug report
description: Something in Kasumi Proxy is broken or misbehaving
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Kasumi Proxy runs on **rooted Android** (a
        Magisk / KernelSU / APatch module) and on **Linux / Windows desktop** (a
        Tauri app). Please fill in the environment fields — most issues are
        platform, root-method, or core specific.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I am on the latest release
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android (root module)
        - Linux desktop (Tauri app)
        - Windows desktop (Tauri app)
        - Not platform-specific (build / CI / UI)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the app? Drives the component label — pick "Other" if unsure.
      options:
        - Web UI (frontend)
        - Proxy core / backend
        - Build / CI / release
        - Nix / packaging
        - Documentation
        - Other / not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: From the Web UI footer / desktop Settings, or `module.prop` (e.g. v0.3.4)
      placeholder: v0.3.4
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS / device
      description: Android → version + device/ROM; Linux → distro + desktop/compositor (X11/Wayland); Windows → edition + build.
      placeholder: "Android 14 — Pixel 7 (stock)  ·  NixOS — Hyprland (Wayland)  ·  Windows 11 23H2"
    validations:
      required: true

  - type: dropdown
    id: root
    attributes:
      label: Root solution (Android only)
      options:
        - "N/A — Linux / Windows desktop"
        - Magisk
        - KernelSU
        - APatch
        - Other / not sure
    validations:
      required: true

  - type: dropdown
    id: core
    attributes:
      label: Affected core
      description: Which engine runs the failing profile? (Xray for VLESS/VMess/Trojan/SS/SOCKS/HTTP/WireGuard, sing-box for Hysteria2/TUIC)
      options:
        - Xray-core
        - sing-box
        - Both / not sure
        - "N/A — not a proxying issue (UI, build, etc.)"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import profile …
        2. Start the proxy …
        3. …
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: From the Web UI / desktop **Logs** page, or `/data/adb/kasumi-proxy/` (Android) / `$XDG_DATA_HOME/kasumi-proxy/` (Linux) / `%APPDATA%\kasumi-proxy\` (Windows). Redact secrets (UUIDs, passwords, server addresses).
      render: shell
